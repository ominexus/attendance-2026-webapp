name: Supabase Keep Alive

on:
  schedule:
    # 3일마다 한국 시간 기준 오전 9시 (UTC 00:00)에 실행
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

jobs:
  keep-alive:
    name: Ping Supabase Project
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase URL 또는 Anon Key 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          echo "Pinging Supabase REST endpoint: $SUPABASE_URL/rest/v1/"
          
          # OpenAPI 스키마 엔드포인트 및 가벼운 DB 테이블 조회 요청
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/?apikey=$SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase project is active and successfully pinged!"
          else
            echo "::warning::Supabase ping returned HTTP $HTTP_STATUS. Trying table query..."
            curl -s -f -X GET "$SUPABASE_URL/rest/v1/teachers?select=count&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
            echo "✅ Supabase table query completed successfully!"
          fi
